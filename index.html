function selected(){return [0]}
function mark(e,i){return state.marks[e.source+'|'+i]||0}
function rows(){let query=$('search').value.toLowerCase().trim();return entries.filter(e=>($('level').value==='All levels'||e.level===$('level').value)&&[e.level,e.group,e.name,e.es,e.en].join(' ').toLowerCase().includes(query)&&(!$('gaps').checked||selected().some(i=>mark(e,i)!==3)))}
function selector(e,i){return '<select class="s'+mark(e,i)+'" aria-label="'+esc(state.names[i]+' · '+e.name)+'" data-row="'+entries.indexOf(e)+'" data-person="'+i+'">'+statuses.map((x,j)=>'<option value="'+j+'" '+(mark(e,i)===j?'selected':'')+'>'+x+'</option>').join('')+'</select>'}
function title(e){return '<small>'+esc(e.level+' / '+e.group.replace(/^(P2-Green|P2-Blue|BROWN) · /,''))+'</small><strong>'+esc(e.es)+'</strong><span class="english">'+esc(e.en)+'</span>'}
function links(e){
 if(!e.video)return '';
 const label=e.group.startsWith('Week ')?e.group+' video':'Supplement video';
 return '<div class="links"><a target="_blank" rel="noopener" href="'+esc(e.video)+'">'+esc(label)+' ↗</a></div>';
}
const beltOrder=['White','Yellow','Orange','Green','Blue','Brown'];
function updateProgress(){
 let done=0,total=0;
 const details=beltOrder.map(belt=>{
  const lessons=entries.filter(e=>e.level===belt);
  const completed=lessons.filter(e=>mark(e,0)===3).length;
  done+=completed;total+=lessons.length;
  return '<span>'+belt+' <b>'+completed+'/'+lessons.length+'</b></span>';
 });
 $('progressTitle').textContent=state.names[0]+' · White to Brown';
 $('progressDetail').textContent=Math.round(100*done/total)+'% · '+done+' of '+total+' grade entries signed off';
 $('overall').max=total;$('overall').value=done;
 $('belts').innerHTML=details.join('');
}
function render(){
 updateProgress();
 const monthly=mode==='monthly';
 $('monthly').setAttribute('aria-pressed',monthly);
 document.querySelector('.toolbar').hidden=monthly;
 $('csv').hidden=monthly;
 if(monthly){$('grid').setAttribute('aria-pressed',false);$('check').setAttribute('aria-pressed',false);calendar();return}
 const items=rows(),ids=selected();$('grid').setAttribute('aria-pressed',mode==='grid');$('check').setAttribute('aria-pressed',mode==='check');$('heading').textContent=mode==='check'?state.names[ids[0]]+' · Checklist':$('level').value+' · Technique grid';const total=items.length*ids.length,done=items.reduce((n,e)=>n+ids.filter(i=>mark(e,i)===3).length,0);$('counts').textContent=items.length+' entries shown · '+done+' / '+total+' student sign-offs in view';
$('view').innerHTML=!items.length?'<p>No entries match these filters.</p>':mode==='grid'?'<div class="scroll"><table><thead><tr><th>Technique / lesson</th>'+ids.map(i=>'<th>'+esc(state.names[i])+'</th>').join('')+'</tr></thead><tbody>'+items.map(e=>'<tr><td>'+title(e)+links(e)+'</td>'+ids.map(i=>'<td>'+selector(e,i)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<div class="cards">'+items.map(e=>'<article class="card"><div>'+title(e)+'</div>'+selector(e,ids[0])+links(e)+'</article>').join('')+'</div>'}
$('view').onchange=ev=>{let s=ev.target;if(!s.matches('select[data-row]'))return;state.marks[entries[s.dataset.row].source+'|'+s.dataset.person]=Number(s.value);save();render()};
for(const id of ['level','gaps'])$(id).onchange=render;$('search').oninput=render;
function switchMode(next){mode=next;render()}$('grid').onclick=()=>switchMode('grid');$('check').onclick=()=>switchMode('check');
$('roster').onclick=()=>{$('fields').innerHTML=state.names.map((n,i)=>'<label>Student '+(i+1)+'<input maxlength="40" value="'+esc(n)+'"></label>').join('');$('dialog').showModal()};$('cancel').onclick=()=>$('dialog').close();
$('names').onsubmit=e=>{e.preventDefault();state.names=[...$('fields').querySelectorAll('input')].map((x,i)=>x.value.trim()||'Jeff');save();$('dialog').close();render()};
$('csv').onclick=()=>{let ids=selected(),data=[['Level','Week / category','Spanish','English','YouTube video',...ids.map(i=>state.names[i])],...rows().map(e=>[e.level,e.group,e.es,e.en,e.video,...ids.map(i=>statuses[mark(e,i)])])];let csv=data.map(r=>r.map(v=>'"'+(/^[=+@-]/.test(v)?"'":"")+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='Keysi_progress.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};const dayMs=86400000;
function localDay(d){return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/dayMs}
const today=localDay(new Date());
if(!Number.isInteger(state.startDay)){state.startDay=today;save()}
state.reviews=state.reviews||{};
let focusDay=today;
const dateAt=d=>new Date(d*dayMs);
const dayLabel=(d,opt)=>dateAt(d).toLocaleDateString('en-GB',{...opt,timeZone:'UTC'});
const weeks=[];
for(const grade of beltOrder){
 const grouped=new Map();
 for(const [index,entry] of entries.entries()){
  if(entry.level!==grade||!/^Week \d+$/.test(entry.group)||/recap|osoto gari/i.test(entry.name))continue;
  if(!grouped.has(entry.group))grouped.set(entry.group,[]);
  grouped.get(entry.group).push(index);
 }
 for(const [group,indices] of grouped)weeks.push({label:grade+' / '+group,indices});
}
function monday(day){return day-(dateAt(day).getUTCDay()+6)%7}
if(!Number.isInteger(state.weekAnchor)){state.weekAnchor=monday(state.startDay);save()}
function weekIndex(day){return Math.floor((day-state.weekAnchor)/7)}
function session(day){
 const week=weeks[weekIndex(day)];
 const offset=day-monday(day);
 if(!week||![0,2,5].includes(offset))return [];
 return week.indices.map(index=>({
  entry:entries[index],index,stage:offset===0?'Learn':'Recall',
  id:'weekly|'+day+'|'+entries[index].source
 }));
}
function calendar(){
 const date=dateAt(focusDay),year=date.getUTCFullYear(),month=date.getUTCMonth();
 const first=Date.UTC(year,month,1)/dayMs,end=Date.UTC(year,month+1,1)/dayMs;
 const items=session(focusDay);
 $('heading').textContent=dayLabel(first,{month:'long',year:'numeric'});
 $('counts').textContent=state.names[0]+' · Weekly syllabus';
 let grid=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>'<b>'+x+'</b>').join('');
 grid+='<span></span>'.repeat((dateAt(first).getUTCDay()+6)%7);
 for(let d=first;d<end;d++){
  const list=session(d),done=list.filter(x=>state.reviews[x.id]).length;
  grid+='<button data-day="'+d+'" aria-pressed="'+(d===focusDay)+'" aria-label="'+dayLabel(d,{day:'numeric',month:'long'})+', '+done+' of '+list.length+' complete">'+(d-first+1)+'<small>'+(list.length?done+'/'+list.length:'—')+'</small></button>';
 }
 $('view').innerHTML='<div class="monthnav"><button data-month="-1" aria-label="Previous month">←</button><button data-today>Today</button><button data-month="1" aria-label="Next month">→</button></div><label>Lesson for the selected week <select id="weekChoice"><option value="" disabled '+(!weeks[weekIndex(focusDay)]?'selected':'')+'>Outside the plan</option>'+weeks.map((w,i)=>'<option value="'+i+'" '+(weekIndex(focusDay)===i?'selected':'')+'>'+esc(w.label)+'</option>').join('')+'</select></label><p style="margin-top:12px">Learn the week’s lesson on Monday. Recall the same material on Wednesday and Saturday. Choose a different lesson above to align the plan with your training.</p><div class="cal">'+grid+'</div><h2>'+dayLabel(focusDay,{weekday:'long',day:'numeric',month:'long'})+'</h2><div class="daylist">'+(items.map(x=>'<label><input type="checkbox" data-review="'+x.index+'" '+(state.reviews[x.id]?'checked':'')+'><span><small>'+esc(x.stage+' · '+x.entry.level+' / '+x.entry.group)+'</small><br><strong>'+esc(x.entry.es)+'</strong><span class="english">'+esc(x.entry.en)+'</span></span></label>').join('')||(weeks[weekIndex(focusDay)]?'<p>Rest day · '+esc(weeks[weekIndex(focusDay)].label)+'</p>':'<p>No syllabus week scheduled.</p>'))+'</div>';
}
$('view').addEventListener('click',ev=>{
 const b=ev.target.closest('button');
 if(mode!=='monthly'||!b)return;
 if(b.hasAttribute('data-today'))focusDay=today;
 else if(b.hasAttribute('data-day'))focusDay=Number(b.dataset.day);
 else if(b.hasAttribute('data-month')){
  const d=dateAt(focusDay);focusDay=Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+Number(b.dataset.month),1)/dayMs;
 }
 calendar();
});
$('view').addEventListener('change',ev=>{
 const b=ev.target;
 if(b.id==='weekChoice'){
  const selected=Number(b.value);
  if(!weeks[selected])return;
  state.weekAnchor=monday(focusDay)-7*selected;
  save();calendar();return;
 }
 if(!b.matches('[data-review]'))return;
 const id='weekly|'+focusDay+'|'+entries[Number(b.dataset.review)].source;
 if(b.checked)state.reviews[id]=true;else delete state.reviews[id];
 save();calendar();
});
$('monthly').onclick=()=>switchMode('monthly');

$('print').onclick=()=>window.print();render();
</script></body></html>
